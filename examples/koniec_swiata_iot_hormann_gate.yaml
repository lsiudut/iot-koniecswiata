# Koniec Swiata IoT - Hormann gate controller example.
#
# This file keeps the two onboard relay "press" buttons enabled. They can be
# wired to a second gate or to dry-contact inputs while Modbus is used for the
# Hormann controller.
#
# Board serial interfaces:
# - Level-shifted UART, not used here: TX GPIO5, RX GPIO4
# - RS485/Modbus adapter: TX GPIO15, RX GPIO6, RTS/DE GPIO7
# - Optional isolated UART HAT, not used here:
#   UART1 TX GPIO39, RX GPIO40; UART2 TX GPIO41, RX GPIO42

esphome:
  name: koniec-swiata-hormann
  friendly_name: Koniec Swiata Hormann Gate
  on_boot:
    priority: -100
    then:
      - script.execute: status_led_idle

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [ethernet]

logger:

api:
  reboot_timeout: 0s

web_server:

ota:
  - platform: esphome

i2c:
  sda: GPIO8
  scl: GPIO18
  scan: true

sensor:
  - platform: lm75b
    name: Board Temperature
    address: 0x48
    accuracy_decimals: 2
    update_interval: 30s
    entity_category: diagnostic
  - platform: internal_temperature
    name: ESP32 Internal Temperature
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    name: Board Temperature Alarm
    pin:
      number: GPIO38
      mode: INPUT_PULLUP
      inverted: true
    entity_category: diagnostic

output:
  - platform: gpio
    id: relay_1_output
    pin: GPIO17
  - platform: gpio
    id: relay_2_output
    pin: GPIO16
  - platform: gpio
    id: status_led_output
    pin: GPIO48

script:
  - id: status_led_idle
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - output.turn_on: status_led_output
            - delay: 1000ms
            - output.turn_off: status_led_output
            - delay: 1000ms
  - id: status_led_relay_feedback
    mode: restart
    then:
      - script.stop: status_led_idle
      - repeat:
          count: 3
          then:
            - output.turn_on: status_led_output
            - delay: 100ms
            - output.turn_off: status_led_output
            - delay: 100ms
      - script.execute: status_led_idle

button:
  - platform: template
    name: Relay 1 Pulse
    on_press:
      - script.execute: status_led_relay_feedback
      - output.turn_on: relay_1_output
      - delay: 250ms
      - output.turn_off: relay_1_output
  - platform: template
    name: Relay 2 Pulse
    on_press:
      - script.execute: status_led_relay_feedback
      - output.turn_on: relay_2_output
      - delay: 250ms
      - output.turn_off: relay_2_output

uart:
  # RS485 UART for Hormann Modbus. Adjust baud/parity if the controller manual
  # or gateway setup says otherwise.
  id: modbus_uart
  tx_pin: GPIO15
  rx_pin: GPIO6
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: GPIO7
  role: client
  send_wait_time: 250ms

modbus_controller:
  # Replace address 0x01 with the slave address configured in the Hormann
  # Modbus gateway/controller.
  - id: hormann
    modbus_id: modbus_bus
    address: 0x01
    update_interval: 2s

# The Hormann register map differs by controller/gateway. The entities below
# are intentionally conservative examples that show where the documented
# addresses go. Verify every address/register_type before enabling writes.
#
# binary_sensor:
#   - platform: modbus_controller
#     modbus_controller_id: hormann
#     name: Gate Open Limit
#     register_type: discrete_input
#     address: 0x0000
#   - platform: modbus_controller
#     modbus_controller_id: hormann
#     name: Gate Closed Limit
#     register_type: discrete_input
#     address: 0x0001
#
# switch:
#   - platform: modbus_controller
#     modbus_controller_id: hormann
#     name: Gate Impulse Command
#     register_type: coil
#     address: 0x0000
#     assumed_state: true

ethernet:
  type: W6100
  mosi_pin: GPIO11
  miso_pin: GPIO13
  clk_pin: GPIO12
  cs_pin: GPIO10
  ncol_pin: GPIO14
  ndpx_pin: GPIO21
  nspd_pin: GPIO47
  interrupt_pin: GPIO9
