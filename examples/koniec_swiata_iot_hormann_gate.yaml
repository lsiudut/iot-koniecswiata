# Koniec Swiata IoT - Hormann / HCPBridge gate controller example.
#
# This file keeps the two onboard relay "press" buttons enabled. They can be
# wired to a second gate or to dry-contact inputs while HCPBridge controls the
# Hormann motor through the board RS485 interface.
#
# Board serial interfaces:
# - Level-shifted UART, not used here: TX GPIO5, RX GPIO4
# - RS485/HCP adapter: TX GPIO15, RX GPIO6, RTS/DE GPIO7
# - Optional isolated UART HAT, not used here:
#   UART1 TX GPIO39, RX GPIO40; UART2 TX GPIO41, RX GPIO42
#
# HCPBridge upstream:
# https://github.com/mapero/esphome-hcpbridge
#
# The upstream component currently targets Arduino and uses its own Hoermann
# engine instead of ESPHome's modbus_controller component.

esphome:
  name: koniec-swiata-hormann
  friendly_name: Koniec Swiata Hormann Gate
  libraries:
    - emelianov/modbus-esp8266
  platformio_options:
    board_build.f_cpu: 240000000L
    monitor_speed: 9600
    monitor_filters: esp32_exception_decoder
  on_boot:
    priority: -100
    then:
      - script.execute: status_led_idle

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

external_components:
  - source: github://lsiudut/iot-koniecswiata
    components: [ethernet]
  - source: github://mapero/esphome-hcpbridge
    components: [hcpbridge]
    refresh: 0s

logger:

api:
  reboot_timeout: 0s
  # HCPBridge cover registers extra services:
  # - esphome.koniec_swiata_hormann_go_to_close
  # - esphome.koniec_swiata_hormann_go_to_half
  # - esphome.koniec_swiata_hormann_go_to_vent
  # - esphome.koniec_swiata_hormann_go_to_open
  custom_services: true

web_server:

ota:
  - platform: esphome

i2c:
  sda: GPIO8
  scl: GPIO18
  scan: true

sensor:
  - platform: lm75b
    name: Board Temperature
    address: 0x48
    accuracy_decimals: 2
    update_interval: 30s
    entity_category: diagnostic
  - platform: internal_temperature
    name: ESP32 Internal Temperature
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    name: Board Temperature Alarm
    pin:
      number: GPIO38
      mode: INPUT_PULLUP
      inverted: true
    entity_category: diagnostic

output:
  - platform: gpio
    id: relay_1_output
    pin: GPIO17
  - platform: gpio
    id: relay_2_output
    pin: GPIO16
  - platform: gpio
    id: status_led_output
    pin: GPIO48

script:
  - id: status_led_idle
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - output.turn_on: status_led_output
            - delay: 1000ms
            - output.turn_off: status_led_output
            - delay: 1000ms
  - id: status_led_relay_feedback
    mode: restart
    then:
      - script.stop: status_led_idle
      - repeat:
          count: 3
          then:
            - output.turn_on: status_led_output
            - delay: 100ms
            - output.turn_off: status_led_output
            - delay: 100ms
      - script.execute: status_led_idle

button:
  - platform: template
    name: Relay 1 Pulse
    on_press:
      - script.execute: status_led_relay_feedback
      - output.turn_on: relay_1_output
      - delay: 250ms
      - output.turn_off: relay_1_output
  - platform: template
    name: Relay 2 Pulse
    on_press:
      - script.execute: status_led_relay_feedback
      - output.turn_on: relay_2_output
      - delay: 250ms
      - output.turn_off: relay_2_output

hcpbridge:
  # The board RS485 transceiver is connected to the Hormann HCP bus.
  # Wire TX/RX according to your adapter direction labels; if the motor never
  # becomes connected, swap A/B on the RS485 side first.
  rx_pin: GPIO6
  tx_pin: GPIO15
  rts_pin: GPIO7
  is_connected:
    name: HCPBridge Connected
    entity_category: diagnostic

cover:
  - platform: hcpbridge
    name: Garage Door
    device_class: garage
    update_interval: 500ms

switch:
  - platform: hcpbridge
    name: Garage Light

ethernet:
  type: W6100
  mosi_pin: GPIO11
  miso_pin: GPIO13
  clk_pin: GPIO12
  cs_pin: GPIO10
  ncol_pin: GPIO14
  ndpx_pin: GPIO21
  nspd_pin: GPIO47
  interrupt_pin: GPIO9
