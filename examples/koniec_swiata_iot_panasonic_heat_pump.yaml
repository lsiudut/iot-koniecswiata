# Koniec Swiata IoT - Panasonic Aquarea heat pump through ESPHome Heishamon.
#
# This example uses the ESPHome component referenced in the Home Assistant
# thread:
# https://github.com/ElVit/esphome_components/tree/main/components/panasonic_heatpump
#
# It expects the dual galvanically isolated UART HAT:
# - UART1 TX GPIO39, RX GPIO40: ESP <-> Panasonic CN-CNT heat pump port
# - UART2 TX GPIO41, RX GPIO42: ESP <-> optional CZ-TAW1/WiFi module passthrough
#
# CN-CNT uses a 5 V UART signal. Keep galvanic isolation / level translation in
# place; do not connect the heat pump UART directly to ESP32-S3 pins.
# Relays are intentionally not configured in this file.

esphome:
  name: koniec-swiata-panasonic
  friendly_name: Koniec Swiata Panasonic Heat Pump
  on_boot:
    priority: -100
    then:
      - script.execute: status_led_idle

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [ethernet]
  - source:
      type: git
      url: https://github.com/ElVit/esphome_components/
    components: [panasonic_heatpump]

logger:

api:
  reboot_timeout: 0s

web_server:

