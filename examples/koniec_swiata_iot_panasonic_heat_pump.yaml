    tank:
      name: DHW

output:
  - platform: gpio
    id: status_led_output
    pin: GPIO48

script:
  - id: status_led_idle
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - output.turn_on: status_led_output
            - delay: 1000ms
            - output.turn_off: status_led_output
            - delay: 1000ms

uart:
  # UART to the Panasonic heat pump CN-CNT port. ESP TX goes to heat pump RX;
  # ESP RX reads heat pump TX.
  - id: uart_heatpump
    tx_pin: GPIO39
    rx_pin: GPIO40
    baud_rate: 9600
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 512
  # Optional passthrough UART for CZ-TAW1 or another CN-CNT client. The
  # panasonic_heatpump component relays frames between this UART and the pump.
  - id: uart_cz_taw1
    tx_pin: GPIO41
    rx_pin: GPIO42
    baud_rate: 9600
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 512

panasonic_heatpump:
  id: my_heatpump
  uart_id: uart_heatpump
  uart_client_id: uart_cz_taw1
  # Set to true temporarily when validating wiring. It logs every 203-byte
  # Panasonic frame and is noisy on a working installation.
  log_uart_msg: false
  update_interval: 3s
  uart_client_timeout: 10s

ethernet:
  type: W6100
  mosi_pin: GPIO11
  miso_pin: GPIO13
  clk_pin: GPIO12
  cs_pin: GPIO10
  ncol_pin: GPIO14
  ndpx_pin: GPIO21
  nspd_pin: GPIO47
  interrupt_pin: GPIO9
