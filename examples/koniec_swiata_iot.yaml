esphome:
  name: koniec-swiata-iot
  friendly_name: Koniec Swiata IoT

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [ethernet]

logger:

api:

web_server:

ota:
  - platform: esphome

ethernet:
  type: W6100
  mosi_pin: GPIO11
  miso_pin: GPIO13
  clk_pin: GPIO12
  cs_pin: GPIO10
  ncol_pin: GPIO14
  ndpx_pin: GPIO21
  nspd_pin: GPIO47
  polling_interval: 10ms

# WiFi fallback is not enabled here because ESPHome's ethernet component
# currently conflicts with the wifi component at config-validation time.
# ESP-IDF can support multiple network interfaces, but this component would
# need runtime enable/disable support and the conflict removed before this
# can be a single valid ESPHome config.
#
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password
#
# captive_portal:
