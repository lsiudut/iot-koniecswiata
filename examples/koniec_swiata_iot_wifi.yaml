esphome:
  name: koniec-swiata-iot
  friendly_name: Koniec Swiata IoT
  on_boot:
    priority: -100
    then:
      - script.execute: status_led_idle

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source: github://lsiudut/iot-koniecswiata
    components: [ethernet]

logger:

api:
  reboot_timeout: 0s

web_server:

ota:
  - platform: esphome

i2c:
  sda: GPIO8
  scl: GPIO18
  scan: true

sensor:
  - platform: lm75b
    name: Board Temperature
    address: 0x48
    accuracy_decimals: 2
    update_interval: 5s
    entity_category: diagnostic
  - platform: internal_temperature
    name: ESP32 Internal Temperature
    update_interval: 10s
    entity_category: diagnostic
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true

binary_sensor:
  - platform: gpio
    name: Board Temperature Alarm
    pin:
      number: GPIO38
      mode: INPUT_PULLUP
      inverted: true
    entity_category: diagnostic

output:
  - platform: gpio
    id: relay_1_output
    pin: GPIO17
  - platform: gpio
    id: relay_2_output
    pin: GPIO16
  - platform: gpio
    id: status_led_output
    pin: GPIO48

script:
  - id: status_led_idle
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - output.turn_on: status_led_output
            - delay: 1000ms
            - output.turn_off: status_led_output
            - delay: 1000ms
  - id: status_led_relay_feedback
    mode: restart
    then:
      - script.stop: status_led_idle
      - repeat:
          count: 3
          then:
            - output.turn_on: status_led_output
            - delay: 100ms
            - output.turn_off: status_led_output
            - delay: 100ms
      - script.execute: status_led_idle

button:
  - platform: template
    name: Relay 1
    on_press:
      - script.execute: status_led_relay_feedback
      - output.turn_on: relay_1_output
      - delay: 250ms
      - output.turn_off: relay_1_output
  - platform: template
    name: Relay 2
    on_press:
      - script.execute: status_led_relay_feedback
      - output.turn_on: relay_2_output
      - delay: 250ms
      - output.turn_off: relay_2_output

