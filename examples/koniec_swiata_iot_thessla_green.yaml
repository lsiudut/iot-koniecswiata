select:
  # Writable enum registers that map cleanly to Home Assistant selects.
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Operating Mode
    address: 0x1070
    value_type: U_WORD
    optionsmap:
      Automatic: 0
      Manual: 1
      Temporary: 2
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Automatic Schedule Season
    address: 0x1071
    value_type: U_WORD
    optionsmap:
      Summer: 0
      Winter: 1
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Special Mode
    address: 0x1080
    value_type: U_WORD
    optionsmap:
      None: 0
      Hood: 1
      Fireplace: 2
      Airing Bell Switch: 3
      Airing On Off Switch: 4
      Airing Hygrostat: 5
      Airing Air Quality: 6
      Airing Manual: 7
      Airing Automatic Schedule: 8
      Airing Manual Schedule: 9
      Open Windows: 10
