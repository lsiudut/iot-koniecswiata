# Koniec Swiata IoT - Thessla Green ventilation unit over Modbus RTU.
#
# Based on the common Home Assistant Modbus setup for Thessla Green units, but
# adapted for a local RS485/Modbus RTU adapter next to the ventilation unit.
# Relays are intentionally not configured in this file.
#
# Board serial interfaces:
# - Level-shifted UART, not used here: TX GPIO5, RX GPIO4
# - RS485/Modbus adapter: TX GPIO15, RX GPIO6, RTS/DE GPIO7
# - Optional isolated UART HAT, not used here:
#   UART1 TX GPIO39, RX GPIO40; UART2 TX GPIO41, RX GPIO42
#
# Confirm baud rate, parity, slave address, and registers against the Thessla
# Green controller/service menu. The active sensors below are read-only examples.

esphome:
  name: koniec-swiata-thessla
  friendly_name: Koniec Swiata Thessla Green
  on_boot:
    priority: -100
    then:
      - script.execute: status_led_idle

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [ethernet]

logger:

api:
  reboot_timeout: 0s

web_server:

ota:
  - platform: esphome

i2c:
  sda: GPIO8
  scl: GPIO18
  scan: true

sensor:
  - platform: lm75b
    name: Board Temperature
    address: 0x48
    accuracy_decimals: 2
    update_interval: 30s
    entity_category: diagnostic
  - platform: internal_temperature
    name: ESP32 Internal Temperature
    update_interval: 60s
    entity_category: diagnostic

  # 04 - READ INPUT REGISTERS. These are read-only runtime values from the
  # AirPack4 controller. Temperature registers use signed words scaled by 0.1.
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Controller Firmware Major
    register_type: read
    address: 0x0000
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Controller Firmware Minor
    register_type: read
    address: 0x0001
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Current Day Of Week
    register_type: read
    address: 0x0002
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Current Schedule Period
    register_type: read
    address: 0x0003
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Controller Firmware Patch
    register_type: read
    address: 0x0004
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Firmware Compilation Days
    register_type: read
    address: 0x000E
    value_type: U_WORD
    unit_of_measurement: d
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Firmware Compilation Seconds
    register_type: read
    address: 0x000F
    value_type: U_WORD
    unit_of_measurement: s
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Outside Air Temperature
    register_type: read
    address: 0x0010
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters: &thessla_temperature_filters
      - multiply: 0.1
      - lambda: |-
          // The official protocol uses raw 0x8000 to mean "no reading".
          if (x > 3000.0f) return NAN;
          return x;
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Supply Air Temperature
    register_type: read
    address: 0x0011
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters: *thessla_temperature_filters
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Exhaust Air Temperature
    register_type: read
    address: 0x0012
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters: *thessla_temperature_filters
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: FPX Air Temperature
    register_type: read
    address: 0x0013
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters: *thessla_temperature_filters
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Duct Supply Temperature
    register_type: read
    address: 0x0014
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters: *thessla_temperature_filters
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: GWC Temperature
    register_type: read
    address: 0x0015
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters: *thessla_temperature_filters
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Ambient Temperature
    register_type: read
    address: 0x0016
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters: *thessla_temperature_filters
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Serial Number Word 1
    register_type: read
    address: 0x0018
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Serial Number Word 2
    register_type: read
    address: 0x0019
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Serial Number Word 3
    register_type: read
    address: 0x001A
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Serial Number Word 4
    register_type: read
    address: 0x001B
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Serial Number Word 5
    register_type: read
    address: 0x001C
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Serial Number Word 6
    register_type: read
    address: 0x001D
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Supply Ventilation Setpoint
    register_type: read
    address: 0x0110
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Exhaust Ventilation Setpoint
    register_type: read
    address: 0x0111
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Supply Flow Setpoint
    register_type: read
    address: 0x0112
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    accuracy_decimals: 0
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Exhaust Flow Setpoint
    register_type: read
    address: 0x0113
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    accuracy_decimals: 0
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Minimum Ventilation Setpoint
    register_type: read
    address: 0x0114
    value_type: U_WORD
    unit_of_measurement: "%"
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Maximum Ventilation Setpoint
    register_type: read
    address: 0x0115
    value_type: U_WORD
    unit_of_measurement: "%"
    entity_category: diagnostic

  # 03 - READ HOLDING REGISTERS used as read-only diagnostic sensors.
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: CF Module Version Raw
    register_type: holding
    address: 0x00F0
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Expansion Module Version Raw
    register_type: holding
    address: 0x00F1
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Supply Air Flow
    register_type: holding
    address: 0x0100
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    accuracy_decimals: 0
    state_class: measurement
    filters: &thessla_flow_filters
      - lambda: |-
          // 65535 means Constant Flow is inactive or unavailable.
          if (x > 65000.0f) return NAN;
          return x;
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Exhaust Air Flow
    register_type: holding
    address: 0x0101
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    accuracy_decimals: 0
    state_class: measurement
    filters: *thessla_flow_filters
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Supply Fan Control Voltage
    register_type: holding
    address: 0x0500
    value_type: U_WORD
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    filters: &thessla_dac_filters
      - multiply: 0.00244
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Exhaust Fan Control Voltage
    register_type: holding
    address: 0x0501
    value_type: U_WORD
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    filters: *thessla_dac_filters
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Heater Control Voltage
    register_type: holding
    address: 0x0502
    value_type: U_WORD
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    filters: *thessla_dac_filters
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Cooler Control Voltage
    register_type: holding
    address: 0x0503
    value_type: U_WORD
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    filters: *thessla_dac_filters
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Antifreeze Stage
    register_type: holding
    address: 0x1066
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: GWC Current Mode
    register_type: holding
    address: 0x10A7
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Comfort Mode Status
    register_type: holding
    address: 0x10D1
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Bypass Mode Status
    register_type: holding
    address: 0x10EA
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Stop Alarm Code
    register_type: holding
    address: 0x1120
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Supply Filter Wear
    register_type: holding
    address: 0x1182
    value_type: U_WORD
    unit_of_measurement: "%"
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Exhaust Filter Wear
    register_type: holding
    address: 0x1183
    value_type: U_WORD
    unit_of_measurement: "%"
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Required Comfort Temperature
    register_type: holding
    address: 0x1FFE
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.5
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Filter Type
    register_type: holding
    address: 0x1FFF
    value_type: U_WORD
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    name: Board Temperature Alarm
    pin:
      number: GPIO38
      mode: INPUT_PULLUP
      inverted: true
    entity_category: diagnostic

  # 01 - READ COILS. These are controller output states, exposed read-only.
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Duct Water Heater Pump Output
    register_type: coil
    address: 0x0005
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Bypass Damper Output
    register_type: coil
    address: 0x0009
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Unit Work Confirmation Output
    register_type: coil
    address: 0x000A
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Fan Power Output
    register_type: coil
    address: 0x000B
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Heating Cable Output
    register_type: coil
    address: 0x000C
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Expansion Work Permit Output
    register_type: coil
    address: 0x000D
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: GWC Output
    register_type: coil
    address: 0x000E
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Hood Damper Output
    register_type: coil
    address: 0x000F
    entity_category: diagnostic

  # 02 - READ DISCRETE INPUTS. These are physical input states on the unit.
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Duct Heater Protection Input
    register_type: discrete_input
    address: 0x0000
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Expansion Module Communication
    register_type: discrete_input
    address: 0x0001
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Duct Filter Pressure Input
    register_type: discrete_input
    address: 0x0003
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Hood Input
    register_type: discrete_input
    address: 0x0004
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Air Quality Sensor Input
    register_type: discrete_input
    address: 0x0005
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Humidity Sensor Input
    register_type: discrete_input
    address: 0x0006
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Airing Switch Input
    register_type: discrete_input
    address: 0x0007
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: AirS Airing Input
    register_type: discrete_input
    address: 0x000A
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: AirS Fan Speed 3 Input
    register_type: discrete_input
    address: 0x000B
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: AirS Fan Speed 2 Input
    register_type: discrete_input
    address: 0x000C
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: AirS Fan Speed 1 Input
    register_type: discrete_input
    address: 0x000D
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Fireplace Input
    register_type: discrete_input
    address: 0x000E
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Fire Alarm Input
    register_type: discrete_input
    address: 0x000F
    device_class: safety
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: AHU Filter Pressure Input
    register_type: discrete_input
    address: 0x0012
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: AHU Filter Protection Input
    register_type: discrete_input
    address: 0x0013
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Empty House Input
    register_type: discrete_input
    address: 0x0015
    entity_category: diagnostic

  # Boolean status registers from holding registers. Alarm bits are R/W in the
  # protocol because some can be reset, but they are exposed here as read-only
  # binary sensors; reset writes should be added only after confirming policy.
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Constant Flow Active
    register_type: read
    address: 0x010F
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Antifreeze Active
    register_type: holding
    address: 0x1060
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: GWC Regeneration Active
    register_type: holding
    address: 0x10AF
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Post Heater Active
    register_type: holding
    address: 0x1260
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Any Alarm
    register_type: holding
    address: 0x2000
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Any Error
    register_type: holding
    address: 0x2001
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S2 I2C Communication Error
    register_type: holding
    address: 0x2002
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S6 FPX Thermal Protection
    register_type: holding
    address: 0x2006
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S7 Calibration Not Possible
    register_type: holding
    address: 0x2007
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S8 Product Key Required
    register_type: holding
    address: 0x2008
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S9 Stopped From AirS Panel
    register_type: holding
    address: 0x2009
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S10 Fire Alarm Triggered
    register_type: holding
    address: 0x200A
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S13 Stopped From Panel
    register_type: holding
    address: 0x200D
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S14 Antifreeze Heater Protection
    register_type: holding
    address: 0x200E
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S15 Antifreeze Heater Protection
    register_type: holding
    address: 0x200F
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S16 Heater Thermal Protection
    register_type: holding
    address: 0x2010
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S17 Supply Filter Not Replaced
    register_type: holding
    address: 0x2011
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S19 Exhaust Filter Not Replaced
    register_type: holding
    address: 0x2013
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S20 Duct Filter Not Replaced
    register_type: holding
    address: 0x2014
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S22 FPX Protection Failed
    register_type: holding
    address: 0x2016
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S23 FPX Inlet Temperature Sensor Fault
    register_type: holding
    address: 0x2017
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S24 Duct Temperature Sensor Fault
    register_type: holding
    address: 0x2018
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S25 Outside Temperature Sensor Fault
    register_type: holding
    address: 0x2019
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S26 Outside And GWC Temperature Sensor Fault
    register_type: holding
    address: 0x201A
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S28 Post Heater Control Fault
    register_type: holding
    address: 0x201C
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S29 High Temperature Before Recuperator
    register_type: holding
    address: 0x201D
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S30 Supply Fan Fault
    register_type: holding
    address: 0x201E
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S31 Exhaust Fan Fault
    register_type: holding
    address: 0x201F
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: S32 TG-02 Communication Fault
    register_type: holding
    address: 0x2020
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: E99 Product Key Required
    register_type: holding
    address: 0x2063
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: E100 Outside Intake Temperature Missing
    register_type: holding
    address: 0x2064
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: E101 Supply Temperature Missing
    register_type: holding
    address: 0x2065
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: E102 Exhaust Temperature Missing
    register_type: holding
    address: 0x2066
    device_class: problem
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: E103 FPX Temperature Missing
    register_type: holding
    address: 0x2067
    device_class: problem
