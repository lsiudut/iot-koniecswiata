# Koniec Swiata IoT - Thessla Green ventilation unit over Modbus RTU.
#
# Based on the common Home Assistant Modbus setup for Thessla Green units, but
# adapted for a local RS485/Modbus RTU adapter next to the ventilation unit.
# Relays are intentionally not configured in this file.
#
# Board serial interfaces:
# - Level-shifted UART, not used here: TX GPIO5, RX GPIO4
# - RS485/Modbus adapter: TX GPIO15, RX GPIO6, RTS/DE GPIO7
# - Optional isolated UART HAT, not used here:
#   UART1 TX GPIO39, RX GPIO40; UART2 TX GPIO41, RX GPIO42
#
# Confirm baud rate, parity, slave address, and registers against the Thessla
# Green controller/service menu. The active sensors below are read-only examples.

esphome:
  name: koniec-swiata-thessla
  friendly_name: Koniec Swiata Thessla Green
  on_boot:
    priority: -100
    then:
      - script.execute: status_led_idle

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [ethernet]

logger:

api:
  reboot_timeout: 0s

web_server:

ota:
  - platform: esphome

i2c:
  sda: GPIO8
  scl: GPIO18
  scan: true

sensor:
  - platform: lm75b
    name: Board Temperature
    address: 0x48
    accuracy_decimals: 2
    update_interval: 30s
    entity_category: diagnostic
  - platform: internal_temperature
    name: ESP32 Internal Temperature
    update_interval: 60s
    entity_category: diagnostic

  # Add Thessla Green read-only values after confirming the register map.
  # Keep address/register_type/value_type aligned with the unit documentation.
  #
  # - platform: modbus_controller
  #   modbus_controller_id: thessla
  #   name: Supply Air Temperature
  #   register_type: read
  #   address: 0x0000
  #   value_type: S_WORD
  #   unit_of_measurement: "°C"
  #   accuracy_decimals: 1
  #   device_class: temperature
  #   state_class: measurement
  #   filters:
  #     - multiply: 0.1
  # - platform: modbus_controller
  #   modbus_controller_id: thessla
  #   name: Fan Speed
  #   register_type: read
  #   address: 0x0001
  #   value_type: U_WORD
  #   unit_of_measurement: "%"
  #   accuracy_decimals: 0
  #   state_class: measurement

binary_sensor:
  - platform: gpio
    name: Board Temperature Alarm
    pin:
      number: GPIO38
      mode: INPUT_PULLUP
      inverted: true
    entity_category: diagnostic

output:
  - platform: gpio
    id: status_led_output
    pin: GPIO48

script:
  - id: status_led_idle
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - output.turn_on: status_led_output
            - delay: 1000ms
            - output.turn_off: status_led_output
            - delay: 1000ms

uart:
  id: modbus_uart
  tx_pin: GPIO15
  rx_pin: GPIO6
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: GPIO7
  role: client
  send_wait_time: 250ms

modbus_controller:
  # Replace 0x01 if the Thessla unit has a different RTU slave address.
  - id: thessla
    modbus_id: modbus_bus
    address: 0x01
    update_interval: 10s

# After verifying the register map, writable controls can be added as
# modbus_controller number/select/switch entities. Keep write controls disabled
# until the exact register and value ranges are confirmed for the installed unit.

ethernet:
  type: W6100
  mosi_pin: GPIO11
  miso_pin: GPIO13
  clk_pin: GPIO12
  cs_pin: GPIO10
  ncol_pin: GPIO14
  ndpx_pin: GPIO21
  nspd_pin: GPIO47
  interrupt_pin: GPIO9
