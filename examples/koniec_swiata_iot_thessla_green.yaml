switch:
  # Simple writable booleans. More destructive bits such as reset/product-lock
  # registers are left as comments below rather than active switches.
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Unit Power
    register_type: holding
    address: 0x1123
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Disable GWC
    register_type: holding
    address: 0x10A0
  - platform: modbus_controller
    modbus_controller_id: thessla
    name: Disable Bypass
    register_type: holding
    address: 0x10E0

output:
  - platform: gpio
    id: status_led_output
    pin: GPIO48

script:
  - id: status_led_idle
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - output.turn_on: status_led_output
            - delay: 1000ms
            - output.turn_off: status_led_output
            - delay: 1000ms

uart:
  id: modbus_uart
  tx_pin: GPIO15
  rx_pin: GPIO6
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

modbus:
  id: modbus_bus
  uart_id: modbus_uart
  flow_control_pin: GPIO7
  role: client
  send_wait_time: 250ms

modbus_controller:
  # Replace 0x01 if the Thessla unit has a different RTU slave address.
  - id: thessla
    modbus_id: modbus_bus
    address: 0x01
    update_interval: 10s

# Official AirPack4 Modbus table coverage notes:
# - Active above: read coils, discrete inputs, runtime input registers, safe
#   user-facing settings, status flags, and alarm/error flags.
# - Intentionally not active: packed date/time, schedule, filter-date,
#   communication-port, product-lock, device-name, access-level, calibration,
#   and hard-reset registers. Those registers either pack multiple values into
#   one word, require simultaneous multi-register writes, can change Modbus
#   communication itself, or can lock/reset/service-calibrate the controller.
# - If you need schedules, add them as raw holding-register sensors first:
#
# sensor:
#   - platform: modbus_controller
#     modbus_controller_id: thessla
#     name: Summer Monday Period 1 Raw Start Time
#     register_type: holding
#     address: 0x0010
#     value_type: U_WORD
#
#   The official format is packed BCD [GGMM], for example raw 0x0630 means
#   06:30 and raw 0xA200 disables an automatic schedule period.

ethernet:
  type: W6100
  mosi_pin: GPIO11
  miso_pin: GPIO13
  clk_pin: GPIO12
  cs_pin: GPIO10
  ncol_pin: GPIO14
  ndpx_pin: GPIO21
  nspd_pin: GPIO47
  interrupt_pin: GPIO9
